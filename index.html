<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PocketFlow Planner</title>
    <!-- Live Markdown compiler library -->
    <script src="https://jsdelivr.net"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Mobile-First Layout Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f8f9fa; color: #212529; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        header { padding: 16px; background: #ffffff; border-bottom: 1px solid #e9ecef; text-align: center; font-weight: 700; font-size: 1.1rem; }

        main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 80px; }

        /* Status text alert */
        .toast { font-size: 12px; color: #868e96; text-align: center; margin-top: -8px; min-height: 18px; }

        /* Editor Area */
        textarea { width: 100%; flex: 1; min-height: 200px; border: 1px solid #ced4da; border-radius: 12px; padding: 14px; font-size: 16px; resize: none; line-height: 1.5; outline: none; }
        textarea:focus { border-color: #228be6; }

        /* Preview Area */
        #previewContainer { display: none; flex: 1; width: 100%; min-height: 200px; background: #ffffff; border: 1px solid #e9ecef; border-radius: 12px; padding: 18px; font-size: 16px; line-height: 1.6; overflow-y: auto; }
        #previewContainer h1 { font-size: 1.5rem; margin-bottom: 12px; color: #228be6; border-bottom: 2px solid #f1f3f5; padding-bottom: 4px; }
        #previewContainer h2 { font-size: 1.25rem; margin-top: 16px; margin-bottom: 8px; color: #212529; }
        #previewContainer p { margin-bottom: 12px; color: #495057; }
        #previewContainer ul { list-style-position: inside; margin-bottom: 12px; padding-left: 4px; }
        #previewContainer li { margin-bottom: 8px; color: #495057; }
        #previewContainer input[type="checkbox"] { width: 20px; height: 20px; margin-right: 10px; vertical-align: middle; accent-color: #228be6; }

        /* Thumb-Friendly Bottom Navigation Bar */
        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #ffffff; border-top: 1px solid #e9ecef; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .nav-btn { background: none; border: none; font-size: 24px; color: #495057; width: 60px; height: 50px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .nav-btn.active { color: #228be6; }
    </style>
</head>
<body>

    <header>📝 PocketFlow</header>

    <main>
        <div class="toast" id="statusLog">Saved locally</div>
        <textarea id="noteInput" placeholder="Type Markdown here...&#10;# Heading 1&#10;## Heading 2&#10;- [ ] Task item"></textarea>
        <div id="previewContainer"></div>
    </main>

    <nav>
        <button class="nav-btn active" id="btnEdit" onclick="switchTab('edit')">✍️</button>
        <button class="nav-btn" id="btnPreview" onclick="switchTab('preview')">👁️</button>
        <button class="nav-btn" onclick="openStripeStore()">🌟</button>
    </nav>

    <script>
        const noteInput = document.getElementById('noteInput');
        const previewContainer = document.getElementById('previewContainer');
        const statusLog = document.getElementById('statusLog');
        const btnEdit = document.getElementById('btnEdit');
        const btnPreview = document.getElementById('btnPreview');

        // Load saved text from browser storage on startup
        window.onload = () => {
            const savedData = localStorage.getItem('pocketFlow_notes');
            if (savedData) { noteInput.value = savedData; }
        };

        // Auto-saves every time user types
        noteInput.addEventListener('input', () => {
            statusLog.innerText = "Typing...";
            localStorage.setItem('pocketFlow_notes', noteInput.value);
            clearTimeout(window.saveTimer);
            window.saveTimer = setTimeout(() => { statusLog.innerText = "Saved to browser storage"; }, 800);
        });

        // Tab switching logic
        function switchTab(tab) {
            if (tab === 'edit') {
                noteInput.style.display = 'block';
                previewContainer.style.display = 'none';
                btnEdit.classList.add('active');
                btnPreview.classList.remove('active');
            } else if (tab === 'preview') {
                previewContainer.innerHTML = marked.parse(noteInput.value || "No content to preview yet. Tap the pencil icon to write notes!");
                noteInput.style.display = 'none';
                previewContainer.style.display = 'block';
                btnEdit.classList.remove('active');
                btnPreview.classList.add('active');
            }
        }

        function openStripeStore() {
            alert("Redirecting securely to your Stripe/Gumroad Link for Pro Templates!");
        }

        // Activates the background offline worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Offline Engine Active"))
                .catch((err) => console.log("Offline Engine Error: ", err));
        }
    </script>
</body>
</html>
